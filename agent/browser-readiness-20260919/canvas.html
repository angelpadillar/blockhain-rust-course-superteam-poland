<!doctype html><meta charset="utf-8"><title>Browser readiness fixture</title><style>body{font:24px sans-serif;margin:60px;background:#eff4f8;color:#102033}button{font:24px sans-serif;margin:12px;padding:25px}canvas{max-width:100%}</style><h1>Local editor control test</h1><p>Choose one preview action.</p><div style=""><canvas width="900" height="120" id="controls"></canvas></div><script>const canvas=document.getElementById('controls');const ctx=canvas.getContext('2d');
const labels=['View transcript','Preview clip','Choose style'];labels.forEach((s,i)=>{ctx.fillStyle='#285a90';ctx.fillRect(i*300+5,10,280,90);ctx.fillStyle='white';ctx.font='24px sans-serif';ctx.fillText(s,i*300+22,63)});
canvas.onclick=e=>{const r=canvas.getBoundingClientRect();location.hash='choice-'+Math.floor((e.clientX-r.left)*900/r.width/300)};</script>
