[package]
name = "gift_campaign_pinocchio"
version = "0.1.0"
description = "Size-optimised Pinocchio port of gift_campaign, wire-compatible with the Anchor program"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "gift_campaign_pinocchio"

[features]
default = []
no-entrypoint = []

[dependencies]
pinocchio = { version = "0.11.2", default-features = false, features = ["cpi", "copy"] }
solana-address = { version = "2.7", default-features = false, features = ["decode"] }
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
