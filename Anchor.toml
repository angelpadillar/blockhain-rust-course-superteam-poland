skip_local_validator = true

[toolchain]

[workspace]
# The Pinocchio port is an alternative binary for the same program id, built
# with `cargo build-sbf`. Keep Anchor from building, generating an IDL for, or
# deploying it as a separate program.
exclude = ["programs/gift_campaign_pinocchio"]

[features]
resolution = true
skip-lint = false

[programs.localnet]
gift_campaign = "F1dNhkpGn5eVL9xWcsnRUf3jevAJdDCU7UN5u7YAEhYb"

[programs.devnet]
gift_campaign = "F1dNhkpGn5eVL9xWcsnRUf3jevAJdDCU7UN5u7YAEhYb"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test --workspace"
